<!DOCTYPE html>
<html>
<head>
  <style>
    body{
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    margin:0;
    padding:40px;
}
.badge{
    padding:6px 12px;
    border-radius:20px;
    color:white;
    font-weight:bold;
    text-transform:capitalize;
}

.approved{
    background:#22c55e;
}

.pending{
    background:#f59e0b;
}
.dashboard{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}
.empty-state{
    text-align:center;
    padding:40px 20px;
    color:#64748b;
}

.register-btn{
    display:inline-block;
    margin-top:15px;
    background:#4f46e5;
    color:white;
    padding:10px 20px;
    border-radius:8px;
    text-decoration:none;
}
.card{
    background:white;
    padding:25px;
    border-radius:16px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.full{
    grid-column:1/3;
}

.card h2{
    color:#4f46e5;
    margin-bottom:20px;
}
.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.logout-btn{
    background:#ef4444;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

.logout-btn:hover{
    background:#dc2626;
}
.welcome{
    color:#64748b;
    margin-bottom:25px;
}
.leaderboard-table{
    width:100%;
    border-collapse:collapse;
}

.leaderboard-table th{
    background:#4f46e5;
    color:white;
    padding:12px;
}

.leaderboard-table td{
    padding:12px;
    border-bottom:1px solid #eee;
}

.leaderboard-table tr:hover{
    background:#f5f7ff;
}
.submission-card{
    padding:15px;
    margin:12px 0;
    border-left:5px solid #4f46e5;
    background:#f8fafc;
    border-radius:10px;
}
  </style>
 
</head>
<body>
<header class="navbar">

    <h1>Hackathon Dashboard</h1>

    <button class="logout-btn" onclick="logout()">
        Logout
    </button>

</header>
<h2 id="welcome" class="welcome">
Loading...
</h2>

<div class="dashboard">

    <div class="card">
        <h2>👥 My Team</h2>
        <div id="teamInfo"></div>
    </div>

    <div class="card">
        <h2>🏆 Leaderboard</h2>
        <div id="leaderboard"></div>
    </div>

    <div class="card full">
        <h2>📤 My Submissions</h2>
        <div id="submissionList"></div>
    </div>

</div>

<script>
async function loadLeaderboard(){

    const res = await fetch(
      "http://localhost:3000/api/leaderboard"
    );

    const teams = await res.json();

    const div =
      document.getElementById(
        "leaderboard"
      );

    let html = `
    <table class="leaderboard-table">
      <tr>
        <th>Rank</th>
        <th>Team</th>
        <th>Score</th>
      </tr>
    `;

    const medals = ["🥇","🥈","🥉","4️⃣","5️⃣"];

teams.slice(0,5).forEach((team,index)=>{

    html += `
    <tr>
        <td>${medals[index]}</td>
        <td>${team.team}</td>
        <td>${team.score}</td>
    </tr>
    `;

});

    html += "</table>";

    div.innerHTML = html;
}
async function loadSubmissions(){

    const token =
      localStorage.getItem("token");

    const res = await fetch(
      "http://localhost:3000/api/my-submissions",
      {
        headers:{
          Authorization:
            `Bearer ${token}`
        }
      }
    );

    const submissions =
      await res.json();

    const div =
      document.getElementById(
        "submissionList"
      );

    if(submissions.length===0){

        div.innerHTML =
          "No submissions yet";

        return;
    }

    let html = "";

    submissions.forEach(s=>{

    html += `
    <div class="submission-card">
        <p><b>Round:</b> ${s.roundNumber}</p>
        <p><b>Solution:</b> ${s.solution}</p>
    </div>
    `;

});

    div.innerHTML = html;
}
async function loadTeam(){

    const token =
      localStorage.getItem("token");

    const res = await fetch(
      "http://localhost:3000/api/my-team",
      {
        headers:{
          Authorization:
            `Bearer ${token}`
        }
      }
    );

    const team =
      await res.json();

    const div =
      document.getElementById(
        "teamInfo"
      );

    if(team.message){

        div.innerHTML = `
<div class="empty-state">
    <h3>🚀 No Team Registered</h3>
    <p>You haven't registered for the hackathon yet.</p>
    <a href="index.html" class="register-btn">
        Register Team
    </a>
</div>
`;

return;
    }

    div.innerHTML = `
        <p><b>Team:</b> ${team.teamName}</p>
        <p><b>Leader:</b> ${team.leader}</p>
        <p>
    <b>Status:</b>
    <span class="badge ${team.status}">
        ${team.status}
    </span>
</p>
        <p><b>Score:</b> ${team.score}</p>
    `;
}
async function loadProfile(){

  const token =
    localStorage.getItem("token");

  if(!token){

    location.href = "login.html";
    return;

  }

  const res = await fetch(
    "http://localhost:3000/api/auth/profile",
    {
      headers:{
        Authorization:
          `Bearer ${token}`
      }
    }
  );

  const user =
    await res.json();

  document.getElementById(
    "welcome"
  ).innerText =
    "Welcome " + user.name;

}

function logout() {

    localStorage.removeItem("token");

    window.location.replace("index.html");

}

loadProfile();
loadTeam();
loadSubmissions();
loadLeaderboard();
</script>

</body>
</html>
