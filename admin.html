<!DOCTYPE html>
<html>
<head>

    <style>
    body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    padding:40px;
    margin:0;
}

/* Headings */

h1{
    text-align:center;
    color:#1e293b;
    font-size:2.4rem;
    margin-bottom:10px;
}

.welcome{
    text-align:center;
    color:#64748b;
    font-size:18px;
    margin-bottom:40px;
}

.section-title{
    text-align:center;
    color:#334155;
    margin-bottom:20px;
}

/* Cards */

.row{
    display:flex;
    justify-content:center;
    gap:25px;
    flex-wrap:wrap;
    margin-bottom:50px;
}

.card{
    width:250px;
    padding:25px;
    border-radius:16px;
    text-align:center;
    color:white;
    box-shadow:0 8px 18px rgba(0,0,0,.12);
    transition:.3s;
    animation:fadeIn .5s ease;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 12px 24px rgba(0,0,0,.18);
}

.card h3{
    margin:0;
    font-size:2.4rem;
}

.card p{
    margin-top:12px;
    font-size:18px;
    font-weight:bold;
}

/* Card Colors */

.total-card{
    background:linear-gradient(135deg,#4f46e5,#6366f1);
}

.approved-card{
    background:linear-gradient(135deg,#16a34a,#22c55e);
}

.pending-card{
    background:linear-gradient(135deg,#f59e0b,#fbbf24);
}

.submission-card{
    background:linear-gradient(135deg,#9333ea,#a855f7);
}

/* Pending Section */

.pending-section{
    width:85%;
    margin:50px auto;
}

/* Table */

.pending-table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 6px 15px rgba(0,0,0,.1);
}

.pending-table th{
    background:#4361ee;
    color:white;
    padding:16px;
    text-align:left;
    font-size:17px;
}

.pending-table td{
    padding:16px;
    border-bottom:1px solid #eee;
    font-size:16px;
}

.pending-table tr:hover{
    background:#f8f9ff;
}

/* Approve Button */

.approve-btn{
    background:#22c55e;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.approve-btn:hover{
    background:#16a34a;
    transform:scale(1.05);
}

/* Animation */

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>Admin Dashboard</title>
</head>
<body>

<h1>Hackathon Admin Dashboard</h1>
<p class="welcome">
    Welcome, Admin 👋
</p>
<div class="row">

  

    <div class="card total-card">
        <h3><i class="fas fa-users"></i> <span id="totalTeams">0</span></h3>
<p>Total Teams</p>
    </div>

    <div class="card approved-card">
        <h3><i class="fas fa-check-circle"></i> <span id="approvedTeams">0</span></h3>
<p>Approved Teams</p>
    </div>

    <div class="card pending-card">
        <h3><i class="fas fa-clock"></i> <span id="pendingTeams">0</span></h3>
<p>Pending Teams</p>
    </div>

    <div class="card submission-card">
        <h3><i class="fas fa-file-upload"></i> <span id="totalSubmissions">0</span></h3>
<p>Total Submissions</p>
    </div>

</div>
<div class="pending-section">
    <h2 class="section-title">Pending Team Requests</h2>
    <div id="pendingTeamsList"></div>
</div>


<script>
async function loadPendingTeams(){
    const div = document.getElementById("pendingTeamsList");
div.innerHTML = "";
    const token =
      localStorage.getItem("token");

    const res = await fetch(
      "http://localhost:3000/api/admin/pending-teams",
      {
        headers:{
          Authorization:`Bearer ${token}`
        }
      }
    );

    const teams =
      await res.json();

    
    if(teams.length===0){

        div.innerHTML = `
<div style="
    background:white;
    padding:30px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
    color:#64748b;
">
    🎉 All teams have been approved!
</div>
`;

        return;
    }
let html = `
<table class="pending-table">
  <tr>
    <th>Team Name</th>
    <th>Leader</th>
    <th>College</th>
    <th>Action</th>
  </tr>
`;

    teams.forEach(team=>{

        html += `
        <tr>
          <td>${team.teamName}</td>
          <td>${team.leader}</td>
          <td>${team.college}</td>
          <td>
            <button
  class="approve-btn"
  onclick="approveTeam('${team.teamName}')">
  ✓ Approve
</button>
          </td>
        </tr>
        `;
    });

    html += "</table>";

    div.innerHTML = html;
}
async function approveTeam(teamName){

    const token =
      localStorage.getItem("token");

    const res = await fetch(
      "http://localhost:3000/api/approve",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          Authorization:`Bearer ${token}`
        },
        body:JSON.stringify({
          teamName
        })
      }
    );

    const data =
      await res.json();

    alert(
      data.status || data.message
    );
await loadAnalytics();
await loadPendingTeams();
    
}
async function loadAnalytics(){

    const token =
      localStorage.getItem("token");

    const res = await fetch(
      "http://localhost:3000/api/admin/analytics",
      {
        headers:{
          Authorization:
            `Bearer ${token}`
        }
      }
    );

    const data = await res.json();

console.log("Analytics:", data);
console.log("Status:", res.status);

    document.getElementById("totalTeams").innerText =
  data.totalTeams;

document.getElementById("approvedTeams").innerText =
  data.approvedTeams;

document.getElementById("pendingTeams").innerText =
  data.pendingTeams;

document.getElementById("totalSubmissions").innerText =
  data.totalSubmissions;
}


loadAnalytics();
loadPendingTeams();
</script>

</body>
</html>
